[package]
name = "artemis-core"
version = "0.1.0"
edition = "2021"
description = "Rust port of the Apache ActiveMQ Artemis CORE wire protocol and client, including local and XA transactions"
license = "Apache-2.0"
readme = "README.md"

[dependencies]
bytes = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
tracing = "0.1"
rand = "0.8"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
